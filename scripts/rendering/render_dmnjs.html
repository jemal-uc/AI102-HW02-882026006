<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>dmn-js DMN 1.3 DRD Verification</title>
  <link rel="stylesheet" href="../../node_modules/dmn-js/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="../../node_modules/dmn-js/dist/assets/dmn-js-shared.css" />
  <link rel="stylesheet" href="../../node_modules/dmn-js/dist/assets/dmn-js-drd.css" />
  <style>
    html, body, #canvas { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; }
    #status { position: fixed; top: 8px; left: 12px; font-family: Arial, sans-serif; font-size: 12px; color: #1b365d; background: rgba(255,255,255,0.9); padding: 4px 8px; border: 1px solid #cbd5e1; z-index: 10; }
  </style>
</head>
<body>
  <div id="status">Loading DMN...</div>
  <div id="canvas"></div>
  <script src="../../node_modules/dmn-js/dist/dmn-viewer.development.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("status");
      try {
        const resp = await fetch("../../src/decision-model/AsuransiNusantara.dmn");
        const xml = await resp.text();
        const viewer = new DmnJS({ container: "#canvas" });
        const { warnings } = await viewer.importXML(xml);
        const activeView = viewer.getActiveView();
        if (activeView && activeView.type === "drd") {
          viewer.getActiveViewer().get("canvas").zoom("fit-viewport", "auto");
        }
        status.textContent = "dmn-js@18.1.0 OK | warnings=" + warnings.length + " | view=" + (activeView ? activeView.type : "none");
      } catch (e) {
        status.textContent = "ERROR: " + e.message;
      }
    })();
  </script>
</body>
</html>
